<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin reports</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{font:14px system-ui;margin:0;background:#f5f7f9}header{padding:20px 5%;background:#12344d;color:#fff}main{max-width:1200px;margin:20px auto;padding:0 18px}#map{height:420px;border-radius:12px}.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:15px;margin:12px 0}.buttons{display:flex;gap:6px;flex-wrap:wrap}.buttons button{padding:8px;border:0;border-radius:7px;cursor:pointer}.help{background:#dff1ff}.context{background:#e8ddff}.ok{background:#d9f4df}.bad{background:#ffe0e0}.more{background:#fff0c9}.box{margin-top:12px;border-top:1px solid #ddd;padding-top:10px}a{color:#1769aa;font-weight:bold}</style></head><body><header><h1>Admin reports</h1><p>Manual review, map, weather, recent news, and important nearby help.</p></header><main><div id="map"></div><div id="list">Loading…</div></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const map=L.map('map').setView([20,78],5);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);async function load(){let a=await(await fetch('/api/admin/reports')).json();document.getElementById('list').innerHTML=a.map(x=>{L.marker([x.latitude,x.longitude]).addTo(map);return `<div class="card"><b>${esc(x.description)}</b><br>AI: ${esc(x.ai_category||'pending')} · Review: ${esc(x.review_status)}<br><small>${x.latitude}, ${x.longitude} · accuracy ${x.accuracy_m??'unknown'} m</small><div class="buttons"><button class="ok" onclick="review('${x.report_id}','verified')">Verified</button><button class="bad" onclick="review('${x.report_id}','rejected')">Rejected</button><button class="more" onclick="review('${x.report_id}','needs_more_information')">Needs more information</button><button class="context" onclick="context('${x.report_id}')">Weather & recent news</button><button class="help" onclick="help('${x.report_id}')">Important nearby help</button></div><div id="box-${x.report_id}"></div></div>`}).join('');if(a.length)map.fitBounds(a.map(x=>[x.latitude,x.longitude]),{padding:[20,20]})}async function review(id,s){let r=await fetch('/api/admin/reports/'+id+'/review',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({review_status:s})});if(!r.ok)alert((await r.json()).detail);else load()}async function context(id){let b=document.getElementById('box-'+id);b.innerHTML='<div class="box">Loading weather and news…</div>';let d=await(await fetch('/api/admin/reports/'+id+'/cross-check')).json();b.innerHTML=`<div class="box"><b>Weather:</b> ${esc(d.weather?.condition||'Unavailable')} · ${esc(d.weather?.precipitation_mm??'—')} mm precipitation<br><b>Recent news:</b>${d.web_evidence?.length?'<ul>'+d.web_evidence.map(x=>`<li><a href="${esc(x.url)}" target="_blank">${esc(x.title||x.url)}</a></li>`).join('')+'</ul>':' No recent results.'}</div>`}async function help(id){let b=document.getElementById('box-'+id);b.innerHTML='<div class="box">Loading important help…</div>';let d=await(await fetch('/api/admin/reports/'+id+'/nearby-help')).json();b.innerHTML=`<div class="box"><b>Important nearby help (up to 4):</b>${d.resources?.length?'<ul>'+d.resources.map(x=>`<li><a href="${esc(x.url)}" target="_blank">${esc(x.title||x.url)}</a><br>${esc(x.description||'')}</li>`).join('')+'</ul>':' No resources found.'}<small>${esc(d.disclaimer||'')}</small></div>`}load();</script></body></html>
