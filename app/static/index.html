<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Report an incident</title><style>body{font:16px system-ui;max-width:640px;margin:2rem auto;padding:1rem}label{display:block;margin:1rem 0}textarea,input,button{font:inherit;padding:.6rem;width:100%;box-sizing:border-box}.row{display:flex;gap:.5rem}.row>*{flex:1}small{color:#667}</style></head><body><h1>Report an incident</h1><form id="form"><label>Description<textarea id="description" minlength="5" maxlength="1000" required></textarea><button type="button" id="record">🎙️ Record description</button><small id="speech">You can also type manually.</small></label><label>Photo<input id="photo" type="file" accept="image/jpeg,image/png,image/webp" capture="environment" required></label><button type="button" id="locate">Use my location</button><p id="location">Enter coordinates manually if GPS is unavailable.</p><div class="row"><label>Latitude<input id="lat" type="number" step="any" min="-90" max="90" required></label><label>Longitude<input id="lon" type="number" step="any" min="-180" max="180" required></label></div><label>Accuracy metres<input id="acc" type="number" step="any" min="0"></label><button>Submit report</button></form><p id="message"></p><script>const $=x=>document.getElementById(x);let rec,parts=[];$('record').onclick=async()=>{if(!navigator.mediaDevices?.getUserMedia){$('speech').textContent='Microphone unavailable; type manually.';return}if(rec?.state==='recording'){rec.stop();return}try{const s=await navigator.mediaDevices.getUserMedia({audio:true});parts=[];rec=new MediaRecorder(s);rec.ondataavailable=e=>parts.push(e.data);rec.onstop=async()=>{s.getTracks().forEach(t=>t.stop());$('speech').textContent='Transcribing…';const r=await fetch('/api/transcribe',{method:'POST',headers:{'Content-Type':rec.mimeType},body:new Blob(parts,{type:rec.mimeType})}),d=await r.json();$('speech').textContent=r.ok?'Transcript added. Please edit if needed.':(d.detail||'Transcription failed');if(r.ok)$('description').value=($('description').value+' '+d.text).trim()};rec.start();$('record').textContent='⏹ Stop recording';$('speech').textContent='Recording…';}catch(e){$('speech').textContent='Microphone permission denied; type manually.'}};$('locate').onclick=()=>navigator.geolocation?.getCurrentPosition(p=>{$('lat').value=p.coords.latitude;$('lon').value=p.coords.longitude;$('acc').value=p.coords.accuracy;$('location').textContent='Location detected.'},()=>{$('location').textContent='GPS unavailable; enter coordinates manually.'});$('form').onsubmit=async e=>{e.preventDefault();let f=new FormData();['description','lat','lon','acc'].forEach((x,i)=>{if($(x).value)f.append(['description','latitude','longitude','location_accuracy_m'][i],$(x).value)});f.append('photo',$('photo').files[0]);let r=await fetch('/api/reports',{method:'POST',body:f}),d=await r.json();$('message').textContent=r.ok?'Submitted. Report ID: '+d.report_id:(d.detail||'Submission failed')};</script></body></html>
